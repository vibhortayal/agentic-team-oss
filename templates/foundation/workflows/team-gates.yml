# Team gates: copy to .github/workflows/team-gates.yml. A gate file, owned by the owner.
#
# Two workflows, split on purpose (team-checks.yml is the other one):
#   team-gates   runs on pull_request_target, so the workflow AND the gate script come
#                from the base branch. It never runs code from the pull request; it only
#                reads the PR's commits with git. A PR cannot change what judges it.
#   team-checks  (team-checks.yml) runs the PR's own code (Verifier checks, lint) on pull_request, with a
#                read-only token and no secrets. If a PR edits this job, team-gates fails
#                it for touching .github/ without the owner's label.
# They are separate files so each PR event starts only the workflow it needs, and a run of
# one never posts a "skipped" result over the other's check.
# Make both jobs required status checks in the branch ruleset on main.
# A review doesn't re-run team-gates, so the Verifier adds the `verified` label to the PR
# right after approving; the labeled event re-runs the verdict check against her approval.
# While a PR is a draft the team is still working on it and it can't merge, so only the
# approval reset runs; every check runs once it is marked ready, and on each change after.
#
# Repository variables: TEAM_OWNER (owner's GitHub login), TEAM_CHECKER (the Verifier's
# GitHub identity; leave empty only for the prototype profile), LINT_CMD (prints
# "<path>\t<rule>" per violation; "none" for prototypes), SETUP_CMD (installs dependencies),
# TEAM_RECEIPTS ("off" only if the owner adds approval labels on GitHub themselves).
name: team-gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]

# Private repos have a monthly Actions allowance: a newer event on the same PR cancels
# the older run, and no job runs longer than 10 minutes.
concurrency:
  group: team-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  team-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write          # to remove approval labels after a new push
      pull-requests: write   # PR labels; also reads reviews for the checker approval
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BODY: ${{ github.event.pull_request.body }}   # read by the script for a "Team branch:" line; never run
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DRAFT: ${{ github.event.pull_request.draft }}
      TEAM_OWNER: ${{ vars.TEAM_OWNER }}
      TEAM_CHECKER: ${{ vars.TEAM_CHECKER }}
      TEAM_RECEIPTS: ${{ vars.TEAM_RECEIPTS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the base branch (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # Credentials stay so the next step can fetch the PR on a private repo. Safe here:
          # this job never runs code from the pull request.
      - name: Fetch the PR's commits as data, never as code to run
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Remove approvals after a new push
        if: github.event.action == 'synchronize'
        run: python3 .github/team/team_gates.py strip-approvals
      - name: Draft (checks wait until the PR is marked ready)
        if: env.DRAFT == 'true'
        run: echo "::notice::Draft pull request. Approvals were reset if needed, and the checks run when it is marked ready."
      - name: Branch class
        if: env.DRAFT != 'true'
        run: python3 .github/team/team_gates.py classify --branch "$BRANCH"
      - name: Tamper guard (zones, tests, evidence, class paths)
        if: env.DRAFT != 'true'
        run: python3 .github/team/team_gates.py tamper --base "$BASE" --head "$HEAD" --branch "$BRANCH"
      - name: Docs budget (lean documentation)
        if: env.DRAFT != 'true'
        env:
          DOCS_BUDGET: ${{ vars.DOCS_BUDGET }}
        run: python3 .github/team/team_gates.py docs --base "$BASE" --head "$HEAD"
      - name: Verifier PASS for this head (tickets)
        if: env.DRAFT != 'true'
        run: python3 .github/team/team_gates.py verdict --base "$BASE" --head "$HEAD" --branch "$BRANCH"
      - name: Limits (budget cap, three BLOCKs)
        if: env.DRAFT != 'true'
        run: python3 .github/team/team_gates.py limits --base "$BASE" --head "$HEAD" --branch "$BRANCH"
