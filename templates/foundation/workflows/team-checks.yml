# Team checks: copy to .github/workflows/team-checks.yml. A gate file, owned by the owner.
# Runs the PR's own code (Verifier checks, lint) with a read-only token and no secrets.
# The gate scripts come from the base branch. The other half, team-gates.yml, judges
# the PR from base without running its code; see the notes there.
#
# Repository variables: LINT_CMD, SETUP_CMD (see team-gates.yml).
name: team-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push on the same PR cancels the older run.
concurrency:
  group: team-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  team-checks:
    if: ${{ !github.event.pull_request.draft }}   # drafts can't merge; this runs when marked ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      LINT_CMD: ${{ vars.LINT_CMD }}
      SETUP_CMD: ${{ vars.SETUP_CMD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Take the gate scripts from base
        run: |
          mkdir -p "$RUNNER_TEMP/gates"
          # The first PR, which installs this kit, has no kit on base to run. Only a gate/
          # branch may pass that way; the owner reviews it by hand.
          if ! git cat-file -e "$BASE:.github/team/team_gates.py" 2>/dev/null; then
            case "$BRANCH" in
              gate/*) echo "::notice::The kit isn't on the base branch yet: this is the install PR, so the owner reviews it by hand."
                      echo "TEAM_BOOTSTRAP=1" >> "$GITHUB_ENV"; exit 0 ;;
              *) echo "::error::The gate kit isn't on the base branch. Install it with a gate/ PR first."; exit 1 ;;
            esac
          fi
          git show "$BASE:.github/team/team_gates.py" > "$RUNNER_TEMP/gates/team_gates.py"
          git show "$BASE:.github/team/run-checks.sh" > "$RUNNER_TEMP/gates/run-checks.sh"
      - name: Project setup
        if: ${{ vars.SETUP_CMD != '' && env.TEAM_BOOTSTRAP != '1' }}
        run: bash -c "$SETUP_CMD"
      - name: Verifier checks
        if: ${{ env.TEAM_BOOTSTRAP != '1' }}
        run: bash "$RUNNER_TEMP/gates/run-checks.sh"
      - name: Quality gate (block new violations only)
        if: ${{ env.TEAM_BOOTSTRAP != '1' }}
        run: python3 "$RUNNER_TEMP/gates/team_gates.py" quality --base "$BASE" --head "$HEAD"
